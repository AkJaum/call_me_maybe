[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Schema-constrained function calling with a small language model"
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy>=1.26",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "flake8>=7.0",
    "mypy>=1.10",
    "pytest>=8.0",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk" }

[tool.mypy]
exclude = ["llm_sdk/", "moulinette/"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.flake8]
exclude = [".venv", "llm_sdk", "moulinette"]
max-line-length = 79
extend-ignore = ["E203"]
